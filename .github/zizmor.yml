rules:
  forbidden-uses:
    config:
      # Reviewed releases: JavaScript actions use Node 24; zizmor is composite.
      # Recheck action.yml runtimes when updating these pins or adding actions.
      # Exact refs reject deprecated releases even when referenced by SHA.
      allow:
        - actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        - docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        - docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        - docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        - docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        - zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
